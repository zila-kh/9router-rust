name: Full-stack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Format
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Release build
        run: cargo build --release --locked --manifest-path rust-backend/Cargo.toml

  pinned-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Materialize pinned frontend
        run: bash scripts/materialize-frontend.sh frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build existing Next/React UI and compatibility runtime
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NINEROUTER_UI_ONLY: "1"
          NINEROUTER_COMPAT_API: "1"
          NINEROUTER_UI_SECRET: ci-internal-route-token
        run: npm run build

  compat-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [rust-backend, pinned-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize pinned frontend
        run: bash scripts/materialize-frontend.sh frontend
      - name: Install UI dependencies
        working-directory: frontend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build UI and compatibility runtime
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NINEROUTER_UI_ONLY: "1"
          NINEROUTER_COMPAT_API: "1"
          NINEROUTER_UI_SECRET: ci-internal-route-token
        run: npm run build
      - name: Build Rust release
        run: cargo build --release --locked --manifest-path rust-backend/Cargo.toml
      - name: Start compatibility stack
        env:
          PORT: "20128"
          NINEROUTER_UI_ORIGIN: http://127.0.0.1:20129
          NINEROUTER_DATA_DIR: ${{ runner.temp }}/9router-data
          DATA_DIR: ${{ runner.temp }}/9router-data
          NINEROUTER_UI_ONLY: "1"
          NINEROUTER_COMPAT_API: "1"
          NINEROUTER_UI_SECRET: ci-internal-route-token
          NINEROUTER_DISABLE_LEGACY_BRIDGE: "1"
          INITIAL_PASSWORD: compat-ci-password
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p "$NINEROUTER_DATA_DIR/auth"
          printf '%s\n' 'ci-machine-id' > "$NINEROUTER_DATA_DIR/machine-id"
          printf '%s\n' 'ci-cli-secret' > "$NINEROUTER_DATA_DIR/auth/cli-secret"
          chmod 600 "$NINEROUTER_DATA_DIR/machine-id" "$NINEROUTER_DATA_DIR/auth/cli-secret"
          (cd frontend && npm run start:ui >"${RUNNER_TEMP}/ui.log" 2>&1 & echo $! >"${RUNNER_TEMP}/ui.pid")
          ./rust-backend/target/release/9router-rust >"${RUNNER_TEMP}/rust.log" 2>&1 & echo $! >"${RUNNER_TEMP}/rust.pid"
          bash scripts/wait-http.sh http://127.0.0.1:20128/api/health 90
      - name: Smoke test Rust and UI
        env:
          NINEROUTER_UI_ORIGIN: http://127.0.0.1:20129
          NINEROUTER_TEST_PASSWORD: compat-ci-password
        run: |
          cli_token="$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('ci-machine-id9r-cli-authci-cli-secret').digest('hex').slice(0,16))")"
          NINEROUTER_TEST_CLI_TOKEN="$cli_token" bash scripts/full-stack-smoke.sh http://127.0.0.1:20128
      - name: Native parity report
        env:
          NINEROUTER_ALLOW_PARITY_GAPS: "1"
        run: bash scripts/release-gate.sh .
      - name: Dump logs on failure
        if: failure()
        run: |
          echo '--- Rust log ---'
          cat "${RUNNER_TEMP}/rust.log" || true
          echo '--- UI log ---'
          cat "${RUNNER_TEMP}/ui.log" || true
