name: Resolve provider catalog environment placeholders

on:
  push:
    paths:
      - .github/workflows/resolve-catalog-env.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add recursive environment resolver and tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('rust-backend/src/providers.rs')
          text = path.read_text()
          old = '''static CATALOG: Lazy<Value> = Lazy::new(|| {
    serde_json::from_str(include_str!("../assets/provider-catalog.json"))
        .unwrap_or_else(|_| json!({"registry":[],"providers":{},"models":{},"oauth":{},"media":{}}))
});
'''
          new = '''fn resolve_env_placeholders_with<F>(value: &mut Value, lookup: &F)
where
    F: Fn(&str) -> Option<String>,
{
    match value {
        Value::String(text) => {
            if let Some(name) = text.strip_prefix("env:") {
                *text = lookup(name).unwrap_or_default();
            }
        }
        Value::Array(items) => {
            for item in items {
                resolve_env_placeholders_with(item, lookup);
            }
        }
        Value::Object(map) => {
            for item in map.values_mut() {
                resolve_env_placeholders_with(item, lookup);
            }
        }
        Value::Null | Value::Bool(_) | Value::Number(_) => {}
    }
}

fn load_catalog() -> Value {
    let mut catalog: Value = serde_json::from_str(include_str!("../assets/provider-catalog.json"))
        .unwrap_or_else(|_| json!({"registry":[],"providers":{},"models":{},"oauth":{},"media":{}}));
    resolve_env_placeholders_with(&mut catalog, &|name| std::env::var(name).ok());
    catalog
}

static CATALOG: Lazy<Value> = Lazy::new(load_catalog);
'''
          if old not in text:
              raise SystemExit('catalog initializer changed unexpectedly')
          text = text.replace(old, new, 1)
          tests = r'''

#[cfg(test)]
mod tests {
    use super::resolve_env_placeholders_with;
    use serde_json::json;

    #[test]
    fn resolves_nested_environment_placeholders() {
        let mut value = json!({
            "clientId": "env:CLIENT_ID",
            "nested": ["keep", {"secret": "env:CLIENT_SECRET"}],
            "number": 7
        });
        resolve_env_placeholders_with(&mut value, &|name| match name {
            "CLIENT_ID" => Some("client-value".into()),
            "CLIENT_SECRET" => Some("secret-value".into()),
            _ => None,
        });
        assert_eq!(value["clientId"], "client-value");
        assert_eq!(value["nested"][0], "keep");
        assert_eq!(value["nested"][1]["secret"], "secret-value");
        assert_eq!(value["number"], 7);
    }

    #[test]
    fn missing_environment_placeholder_becomes_empty() {
        let mut value = json!({"token": "env:MISSING_TOKEN"});
        resolve_env_placeholders_with(&mut value, &|_| None);
        assert_eq!(value["token"], "");
    }
}
'''
          if '#[cfg(test)]\nmod tests {' not in text:
              text += tests
          path.write_text(text)
      - name: Format, check, and test
        run: |
          cargo fmt --manifest-path rust-backend/Cargo.toml --all
          cargo check --locked --manifest-path rust-backend/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Commit verified resolver
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust-backend/src/providers.rs
          git commit -m 'Resolve provider catalog credentials from environment'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
