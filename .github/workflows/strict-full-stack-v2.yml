name: Strict full-stack v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-full-stack-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Materialize pinned existing frontend
        run: bash scripts/materialize-frontend.sh frontend

      - name: Install existing frontend dependencies
        working-directory: frontend
        run: |
          if [[ -f package-lock.json ]]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build existing Next/React frontend in strict UI-only mode
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NINEROUTER_UI_ONLY: "1"
          NINEROUTER_COMPAT_API: "0"
          NINEROUTER_UI_SECRET: strict-ci-internal-token
        run: npm run build

      - name: Rust format
        run: cargo fmt --all --manifest-path rust-backend/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets

      - name: Rust clippy
        run: cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings

      - name: Rust release build
        run: cargo build --release --locked --manifest-path rust-backend/Cargo.toml

      - name: Start existing frontend renderer
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NINEROUTER_UI_ONLY: "1"
          NINEROUTER_COMPAT_API: "0"
          NINEROUTER_DATA_DIR: ${{ runner.temp }}/9router-data
          DATA_DIR: ${{ runner.temp }}/9router-data
        run: |
          mkdir -p "$DATA_DIR"
          nohup npm run start:ui >"${RUNNER_TEMP}/ui.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/ui.pid"

      - name: Start strict Rust backend
        env:
          PORT: "20128"
          NINEROUTER_UI_ORIGIN: http://127.0.0.1:20129
          NINEROUTER_DATA_DIR: ${{ runner.temp }}/9router-data
          DATA_DIR: ${{ runner.temp }}/9router-data
          NINEROUTER_DISABLE_LEGACY_BRIDGE: "1"
          NINEROUTER_COMPAT_API: "0"
          NINEROUTER_UI_ONLY: "1"
        run: |
          mkdir -p "$NINEROUTER_DATA_DIR"
          nohup ./rust-backend/target/release/9router-rust >"${RUNNER_TEMP}/rust.log" 2>&1 &
          echo $! >"${RUNNER_TEMP}/rust.pid"
          bash scripts/wait-http.sh http://127.0.0.1:20128/api/health 90

      - name: Strict frontend/backend smoke test
        env:
          NINEROUTER_TEST_PASSWORD: "123456"
        run: bash scripts/full-stack-smoke-v2.sh http://127.0.0.1:20128

      - name: Reject legacy backend bridge references
        run: bash scripts/no-legacy-backend.sh

      - name: Publish native parity audit
        env:
          NINEROUTER_ALLOW_PARITY_GAPS: "1"
        run: bash scripts/release-gate.sh .

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-full-stack-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/rust.log
            ${{ runner.temp }}/ui.log
