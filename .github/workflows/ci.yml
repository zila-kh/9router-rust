name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Format
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Test
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets

  frontend:
    name: Existing Next frontend
    if: ${{ hashFiles('frontend/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NINEROUTER_UI_ONLY: '1'
          NEXT_TELEMETRY_DISABLED: '1'
