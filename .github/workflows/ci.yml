name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Format
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Test
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets

  frontend:
    name: Existing Next frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Detect vendored frontend
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        if: steps.frontend.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
        env:
          NINEROUTER_UI_ONLY: '1'
          NEXT_TELEMETRY_DISABLED: '1'
