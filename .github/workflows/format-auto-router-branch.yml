name: Format auto-router branch

on:
  push:
    branches:
      - feature/context-aware-auto-router

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/context-aware-auto-router
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all
      - name: Commit formatting only
        run: |
          if git diff --quiet -- rust-backend/src/auto_router.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust-backend/src/auto_router.rs
          git commit -m 'chore: rustfmt hardened auto router [skip ci]'
          git push origin HEAD:feature/context-aware-auto-router
