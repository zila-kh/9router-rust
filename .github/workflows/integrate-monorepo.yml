name: Strict Rust monorepo verification

# This gate verifies the checked-in Rust backend and pinned UI-only frontend together.
on:
  push:
    branches: [main]
    paths:
      - rust-backend/**
      - frontend/**
      - scripts/**
      - .github/workflows/integrate-monorepo.yml
  pull_request:
    paths:
      - rust-backend/**
      - frontend/**
      - scripts/**
      - .github/workflows/integrate-monorepo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Rust format, check, test, and build
        run: |
          cargo fmt --manifest-path rust-backend/Cargo.toml --all -- --check
          cargo check --locked --manifest-path rust-backend/Cargo.toml --all-targets
          cargo test --locked --manifest-path rust-backend/Cargo.toml --all-targets
          cargo build --locked --manifest-path rust-backend/Cargo.toml
      - name: Build pinned frontend
        run: |
          npm --prefix frontend ci
          NINEROUTER_UI_ONLY=1 npm --prefix frontend run build
      - name: Strict end-to-end smoke test
        run: bash scripts/smoke-e2e.sh .
      - name: Report parity inventory
        run: NINEROUTER_ALLOW_PARITY_GAPS=1 node ./scripts/audit-parity.mjs
