name: One-shot release hardening pass 3 retry

on:
  push:
    branches:
      - fix/release-hardening-2026-09

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-hardening-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply validated hardening patches
        run: |
          python3 scripts/release-hardening-pass3-retry.py
          python3 scripts/release-hardening-pass3.py
          npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate generated sources
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust-backend/Cargo.toml --all
          cargo check --locked --all-targets --manifest-path rust-backend/Cargo.toml
          node --check frontend/custom-server.js
          node --check frontend/src/dashboardGuard.js
          node --check frontend/src/app/api/auth/login/route.js
      - name: Remove one-shot helpers
        run: |
          rm -f \
            scripts/release-hardening-pass3.py \
            scripts/release-hardening-pass3-retry.py \
            .github/workflows/release-hardening-pass3.yml \
            .github/workflows/release-hardening-pass3-retry.yml
      - name: Commit hardening changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden credentials, login policy, and frontend dependencies'
          git push origin HEAD:fix/release-hardening-2026-09
