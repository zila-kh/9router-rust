name: Fix integration smoke probe

on:
  push:
    paths:
      - .github/workflows/fix-integration-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair HEAD-only health probe and improve failure diagnostics
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/integrate-monorepo.yml')
          text = path.read_text()
          old = "          curl -fsSI http://127.0.0.1:20128/api/health | tr -d '\\r' | grep -qi '^x-9router-runtime: rust$'"
          new = "          curl -fsS -D \"$TMP/health-headers.txt\" -o /dev/null http://127.0.0.1:20128/api/health\n          tr -d '\\r' <\"$TMP/health-headers.txt\" | grep -qi '^x-9router-runtime: rust$'"
          if old not in text:
              raise SystemExit('health probe pattern not found')
          text = text.replace(old, new, 1)

          old_cleanup = '''          cleanup(){
            jobs -p | xargs -r kill 2>/dev/null || true
            if [[ ${KEEP_E2E_TMP:-0} == 1 ]]; then echo "E2E logs: $TMP"; else rm -rf "$TMP"; fi
          }'''
          new_cleanup = '''          cleanup(){
            status=$?
            set +e
            if (( status != 0 )); then
              echo '=== Rust log ==='; cat "$RUST_LOG" 2>/dev/null || true
              echo '=== UI log ==='; cat "$UI_LOG" 2>/dev/null || true
              echo '=== Mock log ==='; cat "$MOCK_LOG" 2>/dev/null || true
            fi
            jobs -p | xargs -r kill 2>/dev/null || true
            if [[ ${KEEP_E2E_TMP:-0} == 1 ]]; then echo "E2E logs: $TMP"; else rm -rf "$TMP"; fi
            return "$status"
          }'''
          if old_cleanup not in text:
              raise SystemExit('cleanup pattern not found')
          path.write_text(text.replace(old_cleanup, new_cleanup, 1))
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/integrate-monorepo.yml
          git commit -m 'Fix strict E2E health header probe'
          git push origin HEAD:main
