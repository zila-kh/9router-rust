name: Verify Rust source

on:
  push:
    paths:
      - rust-backend/**
      - .github/workflows/autoformat-rust.yml
  pull_request:
    paths:
      - rust-backend/**
      - .github/workflows/autoformat-rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-rust-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all -- --check
      - name: Check all Rust targets
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Test all Rust targets
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Lint all Rust targets
        run: cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings
