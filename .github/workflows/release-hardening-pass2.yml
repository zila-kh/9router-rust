name: One-shot release hardening pass 2

on:
  push:
    branches:
      - fix/release-hardening-2026-09

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-hardening-2026-09
          fetch-depth: 0
      - name: Apply asserted source patches
        run: python3 scripts/release-hardening-pass2.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --all
      - name: Remove one-shot helpers
        run: rm -f scripts/release-hardening-pass2.py .github/workflows/release-hardening-pass2.yml
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden release startup and add regression coverage'
          git push origin HEAD:fix/release-hardening-2026-09
