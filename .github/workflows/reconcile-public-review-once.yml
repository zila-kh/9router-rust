name: Reconcile public review with main

on:
  push:
    branches: [fix/route-policy-second-pass-2026-09]
    paths: [.github/workflows/reconcile-public-review-once.yml]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge reviewed main history and preserve the combined CI workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 44a61aa820608ee67d5a69e39c679285f5920f1a
          test "$(git hash-object .github/workflows/strict-full-stack-v2.yml)" = f66fd56ce1a9abf09603fb3b1864454524a5639f
          cp .github/workflows/strict-full-stack-v2.yml /tmp/reviewed-strict.yml
          if ! git merge --no-commit --no-ff origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = '.github/workflows/strict-full-stack-v2.yml'
            # The reviewed file already incorporates every main startup/parity
            # change, plus locked Rust commands and process cleanup.
            cp /tmp/reviewed-strict.yml .github/workflows/strict-full-stack-v2.yml
            git add .github/workflows/strict-full-stack-v2.yml
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git hash-object .github/workflows/strict-full-stack-v2.yml)" = f66fd56ce1a9abf09603fb3b1864454524a5639f
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD'], text=True).splitlines())
          assert changed <= {'ci/strict-status.json'}, changed
          print('Only main CI status metadata changed; reviewed application and workflow bytes are unchanged.')
          PY
      - name: Verify the reconciled source
        run: |
          node scripts/test-release-boundaries.mjs
          python3 scripts/test-storage-paths.py
          bash -n scripts/run-dev.sh scripts/run-prod.sh scripts/run-full-stack-strict.sh
          git diff --cached --check
      - name: Commit the merge and remove helper
        run: |
          rm .github/workflows/reconcile-public-review-once.yml
          git add .github/workflows/reconcile-public-review-once.yml
          git commit -m 'merge: preserve main CI fixes in the public release review'
          git merge-base --is-ancestor 44a61aa820608ee67d5a69e39c679285f5920f1a HEAD
          git push origin HEAD:fix/route-policy-second-pass-2026-09
