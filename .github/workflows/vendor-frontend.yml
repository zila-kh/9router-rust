name: Vendor pinned 9Router frontend

on:
  push:
    paths:
      - .github/workflows/vendor-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone exact upstream snapshot
        shell: bash
        run: |
          rm -rf /tmp/9router-upstream
          git clone --filter=blob:none https://github.com/decolua/9router.git /tmp/9router-upstream
          git -C /tmp/9router-upstream checkout eb712ca821f0ba6bc41043fbd14494c5af5daba5
          test "$(git -C /tmp/9router-upstream rev-parse HEAD)" = "eb712ca821f0ba6bc41043fbd14494c5af5daba5"
      - name: Export exact provider catalog and route inventory
        shell: bash
        run: |
          mkdir -p /tmp/9router-upstream/rust-backend/assets
          cp scripts/export-rust-catalog.mjs /tmp/9router-upstream/scripts/export-rust-catalog.mjs
          (cd /tmp/9router-upstream && node scripts/export-rust-catalog.mjs)
          cp /tmp/9router-upstream/rust-backend/assets/provider-catalog.json rust-backend/assets/provider-catalog.json
          node -e 'const c=require("./rust-backend/assets/provider-catalog.json"); if (!Array.isArray(c.registry) || c.registry.length < 50) process.exit(1); console.log(`catalog entries: ${c.registry.length}`)'
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          app = Path('/tmp/9router-upstream/src/app')
          routes = []
          for path in sorted((app / 'api').rglob('route.js')):
              text = path.read_text(errors='ignore')
              methods = sorted(set(re.findall(r'export\s+(?:async\s+)?function\s+(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\b', text)))
              routes.append({
                  'file': path.relative_to(app).as_posix(),
                  'methods': methods,
              })
          out = {
              'upstreamCommit': 'eb712ca821f0ba6bc41043fbd14494c5af5daba5',
              'routes': routes,
          }
          Path('rust-backend/parity/upstream-routes.json').write_text(json.dumps(out, indent=2) + '\n')
          print(f'upstream route files: {len(routes)}')
          PY
      - name: Vendor frontend source only
        shell: bash
        run: |
          rm -rf frontend
          mkdir -p frontend
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=gitbook \
            --exclude=tests \
            --exclude=cli \
            --exclude=docs \
            --exclude=skills \
            --exclude=rust-backend \
            /tmp/9router-upstream/ frontend/
          rm -rf frontend/src/app/api
          printf '%s\n' 'eb712ca821f0ba6bc41043fbd14494c5af5daba5' > frontend/.upstream-commit
      - name: Convert Next application to UI-only mode
        shell: bash
        run: |
          cat > frontend/src/proxy.js <<'EOF'
          import { NextResponse } from "next/server";

          const RUST_BACKEND_PREFIXES = ["/api", "/v1", "/v1beta", "/responses", "/codex"];

          function isBackendPath(pathname) {
            return RUST_BACKEND_PREFIXES.some(
              (prefix) => pathname === prefix || pathname.startsWith(`${prefix}/`),
            );
          }

          export default async function proxy(request) {
            if (process.env.NINEROUTER_UI_ONLY === "1") {
              if (isBackendPath(request.nextUrl.pathname)) {
                return NextResponse.json(
                  { error: "Rust backend only", code: "RUST_BACKEND_REQUIRED" },
                  { status: 421, headers: { "Cache-Control": "no-store" } },
                );
              }
              return NextResponse.next();
            }
            const { proxy: dashboardProxy } = await import("./dashboardGuard");
            return dashboardProxy(request);
          }

          export const config = {
            matcher: ["/((?!_next/static|_next/image|favicon\\.ico).*)"],
          };
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          layout = Path('frontend/src/app/layout.js')
          lines = layout.read_text().splitlines()
          blocked = (
              '@/lib/network/initOutboundProxy',
              '@/shared/services/bootstrap',
              '@/lib/consoleLogBuffer',
              'initConsoleLogCapture();',
          )
          lines = [line for line in lines if not any(token in line for token in blocked)]
          layout.write_text('\n'.join(lines) + '\n')

          instrumentation = Path('frontend/src/instrumentation.js')
          text = instrumentation.read_text()
          text = text.replace(
              'export async function register() {\n',
              'export async function register() {\n  if (process.env.NINEROUTER_UI_ONLY === "1") return;\n',
              1,
          )
          instrumentation.write_text(text)

          next_config = Path('frontend/next.config.mjs')
          text = next_config.read_text()
          text = text.replace(
              '  async rewrites() {\n    return [',
              '  async rewrites() {\n    if (process.env.NINEROUTER_UI_ONLY === "1") return [];\n    return [',
              1,
          )
          next_config.write_text(text)

          package = Path('frontend/package.json')
          data = json.loads(package.read_text())
          data['scripts']['dev:ui'] = 'next dev --webpack --hostname 127.0.0.1 --port 20129'
          data['scripts']['start:ui'] = 'next start --hostname 127.0.0.1 --port 20129'
          package.write_text(json.dumps(data, indent=2) + '\n')

          client_id = re.compile(r'\b[0-9]{8,}-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com\b')
          client_secret = re.compile(r'\bGOCSPX-[A-Za-z0-9_-]+\b')
          roots = [Path('frontend'), Path('rust-backend/assets/provider-catalog.json')]
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  try:
                      value = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = client_id.sub('env:NINEROUTER_GOOGLE_CLIENT_ID', value)
                  updated = client_secret.sub('env:NINEROUTER_GOOGLE_CLIENT_SECRET', updated)
                  if updated != value:
                      path.write_text(updated)
          PY
      - name: Install and build pinned frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
        env:
          NINEROUTER_UI_ONLY: '1'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Prove frontend is UI-only and production-buildable
        shell: bash
        run: |
          test -f frontend/.next/BUILD_ID
          test -f frontend/package-lock.json
          test ! -d frontend/src/app/api
          test ! -d frontend/rust-backend
          grep -q 'RUST_BACKEND_REQUIRED' frontend/src/proxy.js
          grep -q 'NINEROUTER_UI_ONLY' frontend/src/instrumentation.js
          ! grep -q '@/lib/network/initOutboundProxy' frontend/src/app/layout.js
          ! grep -q '@/shared/services/bootstrap' frontend/src/app/layout.js
          ! grep -q 'initConsoleLogCapture' frontend/src/app/layout.js
          ! grep -R -E '[0-9]{8,}-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com|GOCSPX-[A-Za-z0-9_-]+' frontend rust-backend/assets/provider-catalog.json
      - name: Remove build products and commit verified source
        shell: bash
        run: |
          rm -rf frontend/node_modules frontend/.next
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend rust-backend/assets/provider-catalog.json rust-backend/parity/upstream-routes.json
          git add -f frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Vendored frontend, catalog, and route inventory are already current.'
            exit 0
          fi
          git commit -m 'Vendor verified UI-only frontend and upstream route inventory'
          git push origin HEAD:main
