name: Vendor pinned 9Router frontend

on:
  push:
    paths:
      - .github/workflows/vendor-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-pinned-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_SHA: 17c4cc76877bd1755030a8414f8d0083f48dcccf

jobs:
  vendor-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone exact upstream snapshot
        shell: bash
        run: |
          rm -rf /tmp/9router-upstream
          git clone --filter=blob:none https://github.com/decolua/9router.git /tmp/9router-upstream
          git -C /tmp/9router-upstream checkout "$UPSTREAM_SHA"
          test "$(git -C /tmp/9router-upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Export exact provider catalog and route inventory
        shell: bash
        run: |
          mkdir -p /tmp/9router-upstream/rust-backend/assets
          cp scripts/export-rust-catalog.mjs /tmp/9router-upstream/scripts/export-rust-catalog.mjs
          (cd /tmp/9router-upstream && node scripts/export-rust-catalog.mjs)
          cp /tmp/9router-upstream/rust-backend/assets/provider-catalog.json rust-backend/assets/provider-catalog.json
          node -e 'const c=require("./rust-backend/assets/provider-catalog.json"); if (!Array.isArray(c.registry) || c.registry.length < 50) process.exit(1); console.log(`catalog entries: ${c.registry.length}`)'
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          app = Path('/tmp/9router-upstream/src/app')
          routes = []
          for path in sorted((app / 'api').rglob('route.js')):
              text = path.read_text(errors='ignore')
              methods = sorted(set(re.findall(r'export\s+(?:async\s+)?function\s+(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\b', text)))
              routes.append({
                  'file': path.relative_to(app).as_posix(),
                  'methods': methods,
              })
          out = {
              'upstreamCommit': os.environ['UPSTREAM_SHA'],
              'routes': routes,
          }
          Path('rust-backend/parity/upstream-routes.json').write_text(json.dumps(out, indent=2) + '\n')
          print(f'upstream route files: {len(routes)}')
          PY
      - name: Vendor frontend and internal compatibility API source
        shell: bash
        run: |
          rm -rf frontend
          mkdir -p frontend
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=gitbook \
            --exclude=tests \
            --exclude=cli \
            --exclude=docs \
            --exclude=skills \
            --exclude=rust-backend \
            /tmp/9router-upstream/ frontend/
          printf '%s\n' "$UPSTREAM_SHA" > frontend/.upstream-commit
      - name: Apply secured Rust public boundary
        shell: bash
        env:
          NINEROUTER_UPSTREAM_SHA: ${{ env.UPSTREAM_SHA }}
        run: bash scripts/materialize-frontend.sh frontend
      - name: Scrub hard-coded OAuth credentials
        shell: python
        run: |
          from pathlib import Path
          import re

          client_id = re.compile(r'\b[0-9]{8,}-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com\b')
          client_secret = re.compile(r'\bGOCSPX-[A-Za-z0-9_-]+\b')
          roots = [Path('frontend'), Path('rust-backend/assets/provider-catalog.json')]
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  try:
                      value = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = client_id.sub('env:NINEROUTER_GOOGLE_CLIENT_ID', value)
                  updated = client_secret.sub('env:NINEROUTER_GOOGLE_CLIENT_SECRET', updated)
                  if updated != value:
                      path.write_text(updated)
      - name: Install and build pinned frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
        env:
          NINEROUTER_UI_ONLY: '1'
          NINEROUTER_COMPAT_API: '1'
          NINEROUTER_UI_SECRET: vendor-build-only-secret
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Prove frontend is isolated and production-buildable
        shell: bash
        run: |
          test -f frontend/.next/BUILD_ID
          test -f frontend/package-lock.json
          test -f frontend/.9router-ui-snapshot
          test -d frontend/src/app/api
          test ! -d frontend/rust-backend
          grep -q 'x-9router-ui-secret' frontend/src/proxy.js
          grep -q 'RUST_BACKEND_REQUIRED' frontend/src/proxy.js
          grep -q 'NINEROUTER_COMPAT_API' frontend/src/instrumentation.js
          grep -q '@/lib/network/initOutboundProxy' frontend/src/instrumentation.js
          grep -q '@/shared/services/bootstrap' frontend/src/instrumentation.js
          ! grep -q '@/lib/network/initOutboundProxy' frontend/src/app/layout.js
          ! grep -q '@/shared/services/bootstrap' frontend/src/app/layout.js
          ! grep -q 'initConsoleLogCapture' frontend/src/app/layout.js
          ! grep -R -E '[0-9]{8,}-[A-Za-z0-9._-]+\.apps\.googleusercontent\.com|GOCSPX-[A-Za-z0-9_-]+' frontend rust-backend/assets/provider-catalog.json
      - name: Remove build products and commit verified source
        shell: bash
        run: |
          rm -rf frontend/node_modules frontend/.next
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend rust-backend/assets/provider-catalog.json rust-backend/parity/upstream-routes.json
          git add -f frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Vendored frontend, compatibility APIs, catalog, and route inventory are already current.'
            exit 0
          fi
          git commit -m 'Vendor upstream 0.5.75 frontend and compatibility APIs'
          branch="${GITHUB_REF_NAME}"
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
