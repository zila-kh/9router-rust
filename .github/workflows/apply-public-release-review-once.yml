name: Apply public release hardening

on:
  push:
    branches: [fix/route-policy-second-pass-2026-09]
    paths: [.github/workflows/apply-public-release-review-once.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Apply reviewed source changes
        run: |
          python3 scripts/apply-public-release-review-once.py
          git add -N rust-backend/src/request_path.rs rust-backend/assets/request-path-cases.json scripts/test-release-boundaries.mjs
          git diff HEAD > /tmp/public-release-hardening.patch
          sha256sum /tmp/public-release-hardening.patch
          cargo fmt --manifest-path rust-backend/Cargo.toml --all
      - name: Validate Rust and release boundaries
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path rust-backend/Cargo.toml --all-targets
          node scripts/test-release-boundaries.mjs
          bash scripts/test-frontend-materialization.sh
          bash -n scripts/materialize-frontend.sh scripts/full-stack-smoke.sh scripts/test-port.sh
          python3 scripts/static-audit.py
          git diff --check
      - name: Save reviewed patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-hardening-review
          path: /tmp/public-release-hardening.patch
          retention-days: 7
      - name: Commit validated changes and remove helpers
        run: |
          rm .github/workflows/apply-public-release-review-once.yml scripts/apply-public-release-review-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/integrate-monorepo.yml frontend/src/dashboardGuard.js rust-backend/assets/request-path-cases.json rust-backend/src/app.rs rust-backend/src/error.rs rust-backend/src/gateway.rs rust-backend/src/main.rs rust-backend/src/request_path.rs rust-backend/src/translate.rs scripts/frontend-overrides/src/dashboardGuard.js scripts/full-stack-smoke.sh scripts/materialize-frontend.sh scripts/test-port.sh scripts/test-release-boundaries.mjs .github/workflows/apply-public-release-review-once.yml scripts/apply-public-release-review-once.py
          git commit -m 'fix: harden routing, invalid JSON handling, errors and frontend installation'
          git push origin HEAD:fix/route-policy-second-pass-2026-09
