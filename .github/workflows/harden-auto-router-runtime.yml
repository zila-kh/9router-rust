name: Harden auto-router runtime behavior

on:
  push:
    branches:
      - feature/context-aware-auto-router

permissions:
  contents: write

jobs:
  harden-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/context-aware-auto-router
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply runtime hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected source in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'rust-backend/src/error.rs',
              '''    #[error("upstream error: {0}")]
              Upstream(String),
              #[error(transparent)]''',
              '''    #[error("upstream error: {0}")]
              Upstream(String),
              #[error("upstream HTTP {status}: {message}")]
              UpstreamHttp { status: u16, message: String },
              #[error(transparent)]'''
          )
          replace(
              'rust-backend/src/error.rs',
              '            Self::Upstream(_) => (StatusCode::BAD_GATEWAY, "Upstream request failed".into()),',
              '''            Self::Upstream(_) | Self::UpstreamHttp { .. } => {
                          (StatusCode::BAD_GATEWAY, "Upstream request failed".into())
                      }'''
          )
          replace(
              'rust-backend/src/error.rs',
              'impl From<rusqlite::Error> for AppError {',
              '''impl AppError {
              pub fn auto_route_retryable(&self) -> bool {
                  match self {
                      Self::Upstream(_) => true,
                      Self::UpstreamHttp { status, .. } => {
                          matches!(*status, 408 | 409 | 425 | 429 | 500..=599)
                      }
                      Self::BadRequest(_)
                      | Self::Unauthorized
                      | Self::Forbidden(_)
                      | Self::NotFound(_)
                      | Self::Internal(_) => false,
                  }
              }
          }

          impl From<rusqlite::Error> for AppError {'''
          )
          replace(
              'rust-backend/src/error.rs',
              '''    #[tokio::test]
              async fn upstream_failures_do_not_disclose_credentials_or_internal_urls() {''',
              '''    #[test]
              fn auto_route_only_retries_transient_upstream_failures() {
                  assert!(AppError::Upstream("network timeout".into()).auto_route_retryable());
                  assert!(AppError::UpstreamHttp { status: 429, message: "rate limited".into() }.auto_route_retryable());
                  assert!(AppError::UpstreamHttp { status: 503, message: "capacity".into() }.auto_route_retryable());
                  assert!(!AppError::UpstreamHttp { status: 400, message: "invalid request".into() }.auto_route_retryable());
                  assert!(!AppError::UpstreamHttp { status: 401, message: "bad auth".into() }.auto_route_retryable());
                  assert!(!AppError::BadRequest("bad request".into()).auto_route_retryable());
              }

              #[tokio::test]
              async fn upstream_failures_do_not_disclose_credentials_or_internal_urls() {'''
          )

          replace(
              'rust-backend/src/auto_router.rs',
              'use crate::{error::AppError, providers, state::AppState};',
              'use crate::{error::AppError, providers, state::AppState, translate::Format};'
          )
          replace(
              'rust-backend/src/auto_router.rs',
              '''pub fn annotate_response(
              response: &mut axum::http::Response<axum::body::Body>,''',
              '''pub fn record_stream_estimate_if_passthrough(
              state: &AppState,
              plan: &RoutePlan,
              target: &str,
              caller: Format,
              wants_stream: bool,
          ) {
              if !wants_stream {
                  return;
              }
              let Ok(resolved) = providers::resolve_model(state, target) else {
                  return;
              };
              let transport = providers::transport(&resolved.provider);
              let transport_format = transport
                  .get("format")
                  .and_then(Value::as_str)
                  .unwrap_or("openai");
              if matches!(transport_format, "kiro" | "commandcode" | "cursor" | "windsurf") {
                  return;
              }
              if caller != Format::from_provider(transport_format) {
                  return;
              }

              let prompt = plan.estimated_input_tokens.min(i64::MAX as u64) as i64;
              if let Err(error) = state.db.usage_record(
                  Some(&resolved.provider),
                  Some(&resolved.model),
                  None,
                  "auto-router:stream-estimate",
                  prompt,
                  0,
                  "stream_estimate",
                  &json!({
                      "estimated": true,
                      "reason": "native pass-through streams do not expose final usage before the response is returned"
                  }),
              ) {
                  tracing::warn!(error = %error, model = %target, "failed to record auto-router stream usage estimate");
              }
          }

          pub fn annotate_response(
              response: &mut axum::http::Response<axum::body::Body>,'''
          )

          replace(
              'rust-backend/src/gateway.rs',
              '''                if let Some(plan) = auto_plan.as_ref() {
                          auto_router::remember_success(plan, &target);
                          auto_router::annotate_response(&mut resp, plan, &target);
                      }''',
              '''                if let Some(plan) = auto_plan.as_ref() {
                          auto_router::record_stream_estimate_if_passthrough(
                              &state,
                              plan,
                              &target,
                              caller,
                              wants_stream,
                          );
                          auto_router::remember_success(plan, &target);
                          auto_router::annotate_response(&mut resp, plan, &target);
                      }'''
          )
          replace(
              'rust-backend/src/gateway.rs',
              '''            Err(e) => {
                      tracing::warn!(model=%target, error=%e, "model candidate failed");
                      last_error = Some(e);
                  }''',
              '''            Err(e) => {
                      tracing::warn!(model=%target, error=%e, "model candidate failed");
                      if auto_plan.is_some() && !e.auto_route_retryable() {
                          tracing::warn!(model=%target, "auto-router stopped fallback on non-retryable error");
                          return Err(e);
                      }
                      last_error = Some(e);
                  }'''
          )
          replace(
              'rust-backend/src/gateway.rs',
              '''        return Err(AppError::Upstream(format!(
                      "{provider} returned HTTP {}: {}",
                      status.as_u16(),
                      truncate(&text, 2048)
                  )));''',
              '''        return Err(AppError::UpstreamHttp {
                      status: status.as_u16(),
                      message: format!(
                          "{provider} returned HTTP {}: {}",
                          status.as_u16(),
                          truncate(&text, 2048)
                      ),
                  });'''
          )
          PY
          cargo fmt --manifest-path rust-backend/Cargo.toml --all
      - name: Check
        run: cargo check --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Test
        run: cargo test --manifest-path rust-backend/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings
      - name: Commit verified runtime hardening
        run: |
          if git diff --quiet -- rust-backend/src/auto_router.rs rust-backend/src/gateway.rs rust-backend/src/error.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rust-backend/src/auto_router.rs rust-backend/src/gateway.rs rust-backend/src/error.rs
          git commit -m 'fix: prevent auto-router token fanout and stream undercount [skip ci]'
          git push origin HEAD:feature/context-aware-auto-router
